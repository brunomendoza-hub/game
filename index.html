<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>⚡ Reflexo</title>

<style>

body{
    font-family: Arial;
    margin:0;
    background: linear-gradient(180deg, #020617, #0f172a);
    color:white;
    text-align:center;
}

/* HEADER */
header{
    padding:20px;
    font-size:28px;
    font-weight:bold;
}

/* CENTRO */
.container{
    margin-top:60px;
}

/* BOTÃO PRINCIPAL */
#botao{
    width:180px;
    height:180px;
    font-size:26px;
    border:none;
    border-radius:50%;
    background:#ef4444;
    color:white;
    display:none;
    cursor:pointer;
    transition:0.2s;
}

#botao:hover{
    transform: scale(1.1);
}

/* BOTÃO INICIAR */
#start{
    padding:18px 30px;
    font-size:22px;
    border:none;
    border-radius:12px;
    background:#22c55e;
    color:#022;
    cursor:pointer;
    font-weight:bold;
}

/* STATUS GRANDE */
#status{
    margin-top:30px;
    font-size:26px;
    font-weight:bold;
}

/* PLACAR */
#placar{
    margin-top:25px;
    font-size:22px;
}

/* ANIMAÇÃO */
.pulso{
    animation: pulso 0.5s;
}

@keyframes pulso{
    0%{ transform: scale(1); }
    50%{ transform: scale(1.3); }
    100%{ transform: scale(1); }
}

</style>

</head>

<body>

<header>⚡ Teste de Reflexo</header>

<div class="container">

    <button id="start" onclick="iniciar()">COMEÇAR</button>

    <br><br>

    <button id="botao" onclick="clicou()">CLIQUE!</button>

    <div id="status">Aguardando...</div>

    <div id="placar">Pontos: 0</div>

</div>

<script>

let pontos = 0;
let tempo;
let ativo = false;

// iniciar
function iniciar(){
    pontos = 0;
    atualizar();

    document.getElementById("status").innerText = "Prepare-se...";
    proximaRodada();
}

// rodada
function proximaRodada(){

    ativo = false;

    document.getElementById("botao").style.display = "none";

    let delay = Math.random() * 2500 + 1000;

    setTimeout(()=>{
        mostrarBotao();
    }, delay);
}

// mostrar botão
function mostrarBotao(){

    let btn = document.getElementById("botao");

    btn.style.background = "#22c55e"; // verde = pode clicar
    btn.innerText = "AGORA!";

    btn.style.display = "inline-block";

    tempo = Date.now();
    ativo = true;

    document.getElementById("status").innerText = "CLIQUE RÁPIDO!";
}

// clique
function clicou(){

    let btn = document.getElementById("botao");

    if(!ativo){

        btn.style.background = "#ef4444";
        btn.innerText = "ERRO!";
        document.getElementById("status").innerText = "Muito cedo 😡";
        pontos = 0;
        atualizar();

        return;
    }

    let tempoClique = Date.now() - tempo;

    btn.classList.add("pulso");

    if(tempoClique < 400){
        pontos++;
        document.getElementById("status").innerText = "🔥 PERFEITO!";
    }
    else if(tempoClique < 700){
        document.getElementById("status").innerText = "👍 BOM!";
    }
    else{
        document.getElementById("status").innerText = "🐢 LENTO!";
    }

    atualizar();

    setTimeout(()=>{
        btn.classList.remove("pulso");
        proximaRodada();
    },500);
}

// atualizar pontos
function atualizar(){
    document.getElementById("placar").innerText = "Pontos: " + pontos;
}

</script>

</body>
</html>
