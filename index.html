<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>⚡ Reflexo PRO</title>

<style>

body{
    font-family: Arial;
    margin:0;
    background: radial-gradient(circle, #1e3a8a, #020617);
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* TITULO */
header{
    position:absolute;
    top:20px;
    font-size:24px;
    letter-spacing:1px;
}

/* BOTÃO GRANDE */
#botao{
    width:220px;
    height:220px;
    border-radius:50%;
    border:none;
    font-size:26px;
    color:white;
    background:#ef4444; /* vermelho */
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:0.2s;
}

/* ANIMAÇÃO PULSO */
.pulso{
    animation: pulso 0.6s infinite;
}

@keyframes pulso{
    0%{transform:scale(1);}
    50%{transform:scale(1.2);}
    100%{transform:scale(1);}
}

/* TEXTO */
#status{
    margin-top:25px;
    font-size:26px;
    font-weight:bold;
}

/* PLACAR */
#placar{
    margin-top:10px;
    font-size:22px;
}

/* BOTÃO START */
#start{
    margin-top:30px;
    padding:15px 30px;
    border:none;
    border-radius:12px;
    font-size:20px;
    background:#22c55e;
    color:#022;
    cursor:pointer;
    transition:0.2s;
}

#start:hover{
    transform:scale(1.1);
}

</style>
</head>

<body>

<header>⚡ Teste de Reflexo</header>

<button id="botao" class="pulso" onclick="clicou()">ESPERA...</button>

<div id="status">Clique em COMEÇAR</div>
<div id="placar">Pontos: 0</div>

<button id="start" onclick="iniciar()">COMEÇAR</button>

<script>

let pontos = 0;
let tempo;
let ativo = false;

function iniciar(){
    pontos = 0;
    atualizar();

    document.getElementById("status").innerText = "Prepare-se...";
    proximaRodada();
}

function proximaRodada(){

    ativo = false;

    let btn = document.getElementById("botao");
    btn.style.background = "#ef4444";
    btn.innerText = "ESPERA...";
    btn.classList.add("pulso");

    let delay = Math.random()*2000+1000;

    setTimeout(()=>{
        mostrar();
    }, delay);
}

function mostrar(){
    let btn = document.getElementById("botao");

    btn.style.background = "#22c55e"; // verde
    btn.innerText = "AGORA!";
    btn.classList.remove("pulso");

    tempo = Date.now();
    ativo = true;

    document.getElementById("status").innerText = "CLICA!";
}

function clicou(){

    let btn = document.getElementById("botao");

    if(!ativo){

        btn.style.background = "#f59e0b"; // amarelo erro
        btn.innerText = "ERRADO!";
        document.getElementById("status").innerText = "Cedo demais 😡";

        pontos = 0;
        atualizar();
        return;
    }

    let tempoClique = Date.now() - tempo;

    if(tempoClique < 350){
        pontos++;
        document.getElementById("status").innerText = "🔥 PERFEITO!";
        btn.style.background = "#22c55e";
    }
    else if(tempoClique < 700){
        document.getElementById("status").innerText = "👍 BOM!";
        btn.style.background = "#3b82f6";
    }
    else{
        document.getElementById("status").innerText = "🐢 LENTO!";
        btn.style.background = "#ef4444";
    }

    atualizar();

    setTimeout(()=>{
        proximaRodada();
    },700);
}

function atualizar(){
    document.getElementById("placar").innerText = "Pontos: " + pontos;
}

</script>

</body>
</html>
``
